return mkOv('uniform float uT,uV;varying vec2 q;void main(){float d=fract(q.x*5.-uT*.9+q.y);float dash=smoothstep(0.,.12,d)*smoothstep(.62,.38,d);float z=(q.x-.5)/.22;vec3 c=mix(vec3(.78,.9,1.),vec3(.25,.78,1.),exp(-z*z));float e=smoothstep(0.,.1,q.x)*smoothstep(1.,.88,q.x);gl_FragColor=vec4(c,dash*e*uV*.9);}',geo(pos,aR,idx),4);})();
// ---- camera choreography: keyframes in the aircraft body frame ('b') or heading frame ('y'); Hermite-interpolated for momentum
const K=[{t:0,f:'b',p:[9.5,3.4,21],l:[-.5,.4,0],fov:42,k:.1},
{t:4.2,f:'b',p:[M.x-5.4,M.y+6.4,M.z+7.2],l:[M.x-1.2,M.y+.2,M.z+.4],fov:36,k:.7},
{t:8.8,f:'b',p:[M.x-3.6,M.y+3.5,M.z+5],l:[M.x-1.5,M.y+.4,M.z+.2],fov:34,k:.7},
{t:13,f:'b',p:[Tp.x+2,Tp.y+2.2,Tp.z+6],l:[Tp.x-5.2,Tp.y+.2,Tp.z-.2],fov:36,k:.5},
{t:17.6,f:'y',p:[-22,6,25],l:[-6,0,0],fov:44,k:0},
{t:25,f:'y',p:[-5,4.6,38],l:[-11,.5,0],fov:40,k:0}];
const kp=K.map(()=>new THREE.Vector3()),kl=K.map(()=>new THREE.Vector3()),ku=K.map(()=>new THREE.Vector3()),_ta=new THREE.Vector3(),_tb=new THREE.Vector3(),_a=new THREE.Vector3(),_b=new THREE.Vector3();
const herm=(a,b,ma,mb,h,u,o)=>{const u2=u*u,u3=u2*u;return o.copy(a).multiplyScalar(2*u3-3*u2+1).addScaledVector(b,3*u2-2*u3).addScaledVector(ma,(u3-2*u2+u)*h).addScaledVector(mb,(u3-u2)*h);};
const tang=(arr,i,o)=>(i<=0||i>=K.length-1)?o.set(0,0,0):o.copy(arr[i+1]).sub(arr[i-1]).divideScalar(K[i+1].t-K[i-1].t);
function cam(t){const ps=poseAt(t,_P,_Q);qa.setFromAxisAngle(AY,ps);_a.copy(UP).applyQuaternion(_Q);
K.forEach((k,i)=>{const q=k.f==='b'?_Q:qa;kp[i].set(...k.p).applyQuaternion(q).add(_P);kl[i].set(...k.l).applyQuaternion(q).add(_P);ku[i].copy(UP).lerp(_a,k.k).normalize();});
let s=0;while(s<K.length-2&&t>=K[s+1].t)s++;const h=K[s+1].t-K[s].t,u=clamp((t-K[s].t)/h,0,1),e=u*u*(3-2*u);
herm(kp[s],kp[s+1],tang(kp,s,_ta),tang(kp,s+1,_tb),h,u,camera.position);
herm(kl[s],kl[s+1],tang(kl,s,_ta),tang(kl,s+1,_tb),h,u,_b);
camera.up.copy(ku[s]).lerp(ku[s+1],e).normalize();camera.lookAt(_b);
let f=lerp(K[s].fov,K[s+1].fov,e);if(camera.aspect<1.3)f*=Math.min(1.8,1.3/camera.aspect);camera.fov=Math.min(f,80);camera.updateProjectionMatrix();}
// ---- captions, anchored labels, controls
const CAP=[[0,'In a hard turn, a fighter can suddenly wrap its wings in a white cloud. Why?'],[4,'A wing makes lift by lowering the pressure above it, and air that expands cools.'],[9,'In humid air, that cooling can condense water vapor into tiny droplets that scatter light.'],[14.2,'When the pressure recovers, the droplets evaporate. The cloud was temporary.'],[17.6,'An exhaust contrail is different: engine exhaust freezing into ice crystals in very cold air.'],[22,'Wing vapor: a brief pressure drop in humid air. Contrail: ice crystals at altitude.']];
const tags=[{a:4.6,b:8.8,txt:'Lower pressure, cooler air',loc:A1},{a:9.6,b:13.6,txt:'Vapor condenses into droplets',loc:A2},{a:14.6,b:17.4,txt:'Pressure recovers, droplets evaporate',loc:A2},{a:18.8,b:25.1,txt:'Exhaust contrail: ice crystals',trail:1}];
tags.forEach(o=>{o.el=document.createElement('div');o.el.className='tag';o.el.textContent=o.txt;$('tags').appendChild(o.el);});
let ci=-1,chipT='',t=0,playing=false,ended=false,sound=false,drag=false,raf=0,last=performance.now();
const sk=$('seek'),pp=$('pp'),ps2=new THREE.Vector2();
function setCap(t,now){let i=0;while(i<CAP.length-1&&t>=CAP[i+1][0])i++;if(i===ci)return;const first=ci<0;ci=i;const c=$('cap');clearTimeout(c._t);if(first){c.textContent=CAP[i][1];return;}c.style.opacity=0;c._t=setTimeout(()=>{c.textContent=CAP[ci][1];c.style.opacity=1;},160);}
const setUI=()=>{pp.textContent=playing?'Pause':(ended?'Replay':'Play');$('snd').textContent=sound?'Sound on':'Sound off';};
// ---- audio: synthesized jet-like rumble + airflow hiss; created only from a user gesture
let ac,mg,lp,wg;
function audioInit(){if(ac){ac.resume();return;}const AC2=window.AudioContext||window.webkitAudioContext;if(!AC2)return;ac=new AC2();
const nb=br=>{const len=ac.sampleRate*4,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(br){l=(l+.02*w)/1.02;d[i]=l*3.2;}else d[i]=w*.5;}const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.start();return s;};
mg=ac.createGain();mg.gain.value=0;lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;nb(1).connect(lp).connect(mg);
const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.7;wg=ac.createGain();wg.gain.value=0;nb(0).connect(bp).connect(wg).connect(mg);mg.connect(ac.destination);}
function audioUpdate(t){if(!ac)return;const n=ac.currentTime;mg.gain.setTargetAtTime(sound&&playing?.6:0,n,.08);lp.frequency.setTargetAtTime(380+520*sm(0,3.5,t)-200*sm(19,25,t),n,.15);wg.gain.setTargetAtTime(.1*sm(1,4,t)*(1-sm(13,18,t))+.04*sm(15.5,19,t),n,.2);}
function start(s){sound=s;if(s)audioInit();t=0;playing=true;ended=false;$('load').classList.add('off');setUI();}
pp.onclick=()=>{if(ended){t=0;ended=false;}playing=!playing;if(playing&&sound)audioInit();setUI();};
$('rp').onclick=()=>{t=0;ended=false;playing=true;if(sound)audioInit();setUI();};
$('snd').onclick=()=>{sound=!sound;if(sound)audioInit();setUI();};
$('goS').onclick=()=>start(true);$('goM').onclick=()=>start(false);
sk.oninput=()=>{t=+sk.value;ended=t>=T;if(ended)playing=false;setUI();};sk.onpointerdown=()=>{drag=true;};addEventListener('pointerup',()=>{drag=false;});
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();pp.click();}});
// ---- per-frame update: everything below is a pure function of t
function update(t){
poseAt(t,root.position,root.quaternion);root.updateMatrixWorld(true);cam(t);sky.position.copy(camera.position);
const px=ps2.y/(2*Math.tan(camera.fov*Math.PI/360));
const vC=(.38*sm(1.2,4,t)+.62*sm(8.6,11.6,t))*(1-sm(14.2,17.4,t)),vF=sm(1.4,4.5,t)*(1-sm(12.6,16,t)),vo=sm(2.2,5.5,t)*(1-sm(14.2,17.4,t)),co=sm(15.2,17.8,t);
pmats.forEach(m=>{m.uniforms.uT.value=t;m.uniforms.uPx.value=px;});
wingC.material.uniforms.uV.value=vC;wingF.material.uniforms.uV.value=vF;vor.material.uniforms.uV.value=vo;con.material.uniforms.uV.value=co;
patch.uniforms.uV.value=sm(3.8,5.6,t)*(1-sm(8.6,11,t));flow.uniforms.uV.value=sm(4,5.4,t)*(1-sm(9.4,12,t));flow.uniforms.uT.value=t;
updVortex(t);updContrail(t);
for(const c of clouds)c.material.opacity=c.userData.o*sm(250,900,c.position.distanceTo(camera.position));
const W=innerWidth,Hh=innerHeight;
for(const o of tags){const op=sm(o.a,o.a+.5,t)*(1-sm(o.b-.5,o.b,t));
if(o.trail){poseAt(t-2.8,_P,_Q);_v.copy(LM.nz[0]).applyQuaternion(_Q).add(_P);_v.y+=1.6;}else root.localToWorld(_v.copy(o.loc));
_v.project(camera);const vis=op>.02&&_v.z<1;o.el.style.opacity=vis?op:0;if(vis)o.el.style.transform='translate('+((_v.x*.5+.5)*W)+'px,'+((-_v.y*.5+.5)*Hh)+'px) translate(-50%,-135%)';}
setCap(t);const ch=t<17.4?'Humid air, hard turn':'Very cold air, high altitude';if(ch!==chipT){chipT=ch;$('chip').textContent=ch;}
if(!drag)sk.value=t;$('tm').textContent=t.toFixed(1)+' / 25 s';audioUpdate(t);}
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.5:2));renderer.setSize(w,h,false);camera.aspect=w/h;renderer.getDrawingBufferSize(ps2);}
addEventListener('resize',resize);resize();
function loop(now){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(playing){t+=dt;if(t>=T){t=T;playing=false;ended=true;setUI();}}update(t);renderer.render(scene,camera);}
addEventListener('pagehide',()=>{cancelAnimationFrame(raf);if(ac)ac.close();renderer.dispose();});
update(0);renderer.render(scene,camera);setUI();
$('lmsg').textContent='Ready. Sound is a synthesized jet-like tone, not a recording.';$('go').hidden=false;raf=requestAnimationFrame(loop);
}
main().catch(e=>{console.error(e);fail('Something went wrong: '+(e&&e.message||e));});
